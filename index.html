<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tecnofeudo</title>
<style>
  /* Sin "inset": top/right/bottom/left por separado (Safari < 14.1). */
  :root{--fondo:#14181f;--panel:rgba(20,24,31,.92);--borde:#2e3644;--tinta:#eef1f5;--suave:#93a0af;
    --neon:#d4af5a;--neon2:#4fb3e0;--oro:#ffe14d;--malo:#ff5d7a}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--fondo);color:var(--tinta);
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #lienzo{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none}
  #ui > *{pointer-events:auto}
  #ui > .acciones,#ui > .revelada{pointer-events:none}
  button{font:inherit;font-weight:700;color:var(--tinta);background:#2d2360;border:1px solid var(--borde);
    border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:var(--neon2)}
  button.grande{background:linear-gradient(135deg,#8a1fd1,#ff2bd6);border:0;padding:12px 18px;font-size:16px}
  button.grande.flojo{background:#4a3a74}
  button.secundario{background:transparent}
  button.mini-b{padding:2px 8px}
  input,select{font:inherit;color:var(--tinta);background:#140f2e;border:1px solid var(--borde);border-radius:8px;padding:8px}
  .fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  small{color:var(--suave)}

  /* Pantallas de menú */
  .pantalla{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;padding:24px 16px 40px;box-sizing:border-box;
    background:rgba(11,10,26,.72);text-align:center}
  .pantalla > *{max-width:980px;margin-left:auto;margin-right:auto}
  h1{font-size:clamp(40px,9vw,76px);margin:8px auto 0;letter-spacing:.04em;font-style:italic;
    text-shadow:0 0 18px var(--neon)}
  h1 span{color:var(--neon2);text-shadow:0 0 18px var(--neon2)}
  .lema{color:var(--suave);margin-top:4px}
  .opciones{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .bloque{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:10px;min-width:260px}
  .bloque h3{margin:0}
  #inCodigo{width:90px;text-transform:uppercase;letter-spacing:.2em;text-align:center}
  .sala .codigo{font-size:56px;font-weight:900;letter-spacing:.25em;color:var(--oro);text-shadow:0 0 16px var(--oro)}
  .sala input{flex:1;min-width:0}
  .jugadores{list-style:none;padding:0;text-align:left;max-width:420px}
  .jugadores li{background:var(--panel);margin:6px 0;padding:8px 10px;border-radius:8px;border-left:4px solid var(--c)}
  .punto{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}

  /* Partida */
  .barra{position:absolute;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;justify-content:space-between;
    padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--borde)}
  .barra .mazos{color:var(--suave);white-space:nowrap}
  .lateral{position:absolute;top:52px;left:8px;width:230px;max-height:40vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--borde);border-radius:10px;padding:6px 8px;font-size:12px}
  .marcador{list-style:none;margin:0;padding:0}
  .marcador li{padding:3px 4px;border-radius:6px}
  .marcador li.turno{background:rgba(255,43,214,.18)}
  .marcador li.off{opacity:.45}
  .log{margin:6px 0 0;padding-left:16px;color:var(--suave)}
  .log li:first-child{color:var(--tinta)}
  .combate{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:1fr auto 1fr;
    gap:4px 14px;align-items:center;background:var(--panel);border:1px solid var(--malo);border-radius:12px;padding:8px 14px;
    width:min(440px,calc(100% - 270px));text-align:center}
  .combate .lado b{display:block;font-size:30px;color:var(--oro)}
  .combate .monstruo b{color:var(--malo)}
  .combate .vs{font-weight:900;font-style:italic;color:var(--neon)}
  .combate p{grid-column:1/-1;margin:0;font-size:12px;color:var(--suave)}
  .combate .mods{color:var(--malo)}
  .acciones{position:absolute;left:0;right:0;bottom:calc(min(250px,36vh) + 10px);display:flex;gap:10px;justify-content:center;
    flex-wrap:wrap;padding:0 8px;pointer-events:none}
  .acciones > *{pointer-events:auto}
  .espera{background:var(--panel);padding:6px 12px;border-radius:20px;color:var(--suave)}
  .mizona{position:absolute;left:0;right:0;bottom:0;height:min(250px,36vh);display:flex;gap:10px;padding:8px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));box-sizing:border-box;background:var(--panel);border-top:1px solid var(--borde)}
  .ficha{flex:none;width:210px;display:flex;gap:6px;font-size:12px}
  .ficha canvas{width:80px;height:100%;flex:none;background:radial-gradient(circle at 50% 70%,#23282f,transparent 70%)}
  .zonaEquipo{flex:none;width:170px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .zonaEquipo .carta{width:auto;min-height:0}
  .zonaEquipo .carta p{display:none}
  .mano{flex:1;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;align-items:flex-start}
  .compra{flex:1;overflow-y:auto;font-size:13px}
  .compra p{margin:4px 0}
  .compra .ok{color:#76ff5c}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{background:#1b1540;border:1px solid var(--borde);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700}
  .chip.on{background:var(--oro);color:#1b1540;border-color:var(--oro)}
  .carta{flex:none;width:150px;min-height:120px;box-sizing:border-box;background:#1b1540;border:1px solid var(--borde);
    border-top:5px solid #888;border-radius:10px;padding:6px 8px;cursor:pointer;font-size:12px;text-align:left}
  .carta.sel{border-color:var(--neon2);box-shadow:0 0 12px var(--neon2)}
  .carta.inactivo{opacity:.55;border-top-style:dashed}
  .carta .malo{margin:4px 0 0;font-size:11px;font-weight:700}
  .carta .tipo{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave)}
  .carta b{display:block;font-size:13px;margin:2px 0}
  .carta .stats{color:var(--oro);font-weight:700}
  .carta p{margin:4px 0 0;color:var(--suave)}
  .carta .botones{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .carta .botones button{padding:4px 8px;font-size:12px}
  .carta.monstruo{border-top-color:#ff3b5c}.carta.maldicion{border-top-color:#9b3bff}.carta.modificador{border-top-color:#ff8a3b}
  .carta.equipo{border-top-color:#4fb3e0}.carta.unUso{border-top-color:#ffe14d}.carta.nivel{border-top-color:#76ff5c}
  .revelada{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;
    animation:revelar 2.6s ease forwards}
  .revelada .carta{width:190px;font-size:14px;box-shadow:0 0 30px rgba(255,43,214,.6)}
  @keyframes revelar{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
  .final{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(11,10,26,.8);text-align:center}
  .final h2{font-size:44px;color:var(--oro);text-shadow:0 0 20px var(--oro);margin:0}
  .aviso{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:10;padding:10px 16px;border-radius:10px;
    background:#5a1030;border:1px solid var(--malo);max-width:90%;text-align:center}
  .aviso.info{background:#123a4a;border-color:var(--neon2)}
  .malo{color:var(--malo)}
  .como select{padding:4px}

  /* Intercambios, saldo y chat (paneles fuera de #ui) */
  .saldo{color:var(--oro);font-weight:700}
  .insignia{background:var(--malo);color:#fff;border-radius:10px;padding:0 5px;font-size:11px}
  #panelTrato{display:none;position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));
    max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--neon2);border-radius:12px;padding:10px 14px;
    box-shadow:0 0 30px rgba(0,0,0,.6);font-size:13px}
  #panelTrato h3{margin:0 0 6px}#panelTrato h4{margin:0 0 4px;color:var(--suave)}
  #panelTrato .columnas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #panelTrato .creditos{margin-top:6px;display:flex;align-items:center;gap:6px}
  #panelTrato .estado{min-height:1.2em;color:var(--oro);margin:6px 0}
  #panelTrato .fila{display:flex;gap:8px}
  #panelTrato button[disabled]{opacity:.45}
  #panelChat{display:none;position:fixed;z-index:5;top:52px;right:8px;width:260px;max-width:calc(100% - 16px);height:240px;flex-direction:column;
    background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:6px;font-size:12px}
  #chatLista{flex:1;overflow-y:auto;margin:0 0 6px;padding-left:0;list-style:none}
  #chatLista li{padding:2px 0;word-break:break-word}
  #chatPara{margin-bottom:4px}
  #panelChat.privado{border-color:var(--neon)}
  #chatLista li.priv{color:var(--neon2)}
  #chatForm{display:flex;gap:4px}#chatForm input{flex:1;min-width:0}

  @media (max-width:760px){
    .lateral{width:150px;max-height:22vh;top:48px}
    .lateral .log{display:none}
    .combate{left:auto;right:6px;transform:none;width:calc(100% - 172px);top:50px;padding:6px}
    .combate .lado b{font-size:22px}
    .combate p{display:none}
    .mizona{height:min(290px,44vh);flex-wrap:wrap;gap:6px}
    .acciones{bottom:calc(min(290px,44vh) + 8px)}
    .ficha{width:auto;flex:1 1 38%;height:86px;overflow:hidden;min-width:0}
    .ficha canvas{width:56px}
    .ficha small{display:none}
    .zonaEquipo{width:auto;flex:1 1 56%;min-width:0;height:86px;flex-direction:row;align-items:stretch;overflow-x:auto;overflow-y:hidden}
    /* Cartas de equipo compactas: sin tipo, texto pequeño y scroll propio si hay botones. */
    .zonaEquipo .carta{width:132px;padding:4px 6px;font-size:11px;overflow-y:auto}
    .zonaEquipo .carta .tipo{display:none}
    .zonaEquipo .carta b{font-size:12px;margin:0}
    .mano{flex-basis:100%;height:calc(100% - 96px)}
    #panelTrato .columnas{grid-template-columns:1fr}
    #panelChat{top:46px;height:200px}
    .barra{font-size:12px;padding:6px 8px}
  }
</style>
<!-- Script clásico ANTES de los módulos: así captura también sus errores de carga. -->
<script src="engine/errores.js"></script>
<!-- PeerJS: solo presenta a los navegadores; luego la partida va directa entre ellos. -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<canvas id="lienzo" aria-hidden="true"></canvas>
<div id="ui"></div>
<script type="module" src="juego/main.js"></script>
</body>
</html>
